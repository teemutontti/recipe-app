name: Build and Deploy Docker image to Azure

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        working-directory: browser/backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/recipeapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/recipeapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
      
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-container-deploy@v1
        with:
          app-name: 'recipeapp'
          slot-name: 'Production'
          image-name: ${{ secrets.DOCKER_USERNAME }}/recipeapp:latest
