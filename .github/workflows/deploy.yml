name: Build and Deploy Docker image to Azure

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types:
      - completed
    branches:
      - devel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission to gradlew
        run: chmod +x ./browser/backend/gradlew

      - name: Build with Gradle
        working-directory: ./browser/backend
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          DB_URL: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew build

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        working-directory: browser/backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/recipeapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/recipeapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
      
    steps:      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'recipeapp-api'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
